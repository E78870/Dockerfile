services:
  sub-store:
    image: xream/sub-store:latest
    container_name: sub-store
    restart: always
    network_mode: host
    volumes:
      - ./sub-store-data:/opt/app/data
    environment:
      TZ: Asia/Shanghai
      # host 模式：把监听收紧到本机（官方默认是 ::，必须限制）
      HOST: 0.0.0.0                 # HTTP-META 监听地址
      PORT: 9876                      # HTTP-META 端口（冲突可改）
      SUB_STORE_BACKEND_API_HOST: 127.0.0.1   # 后端裸 API，别放开
      SUB_STORE_BACKEND_API_PORT: 3000
      SUB_STORE_FRONTEND_HOST: 0.0.0.0      # 要局域网访问改成 0.0.0.0
      SUB_STORE_FRONTEND_PORT: 3001
      SUB_STORE_FRONTEND_BACKEND_PATH: /2cXaAxRGfddmGz2yx1wA
      SUB_STORE_CORS_ALLOWED_ORIGINS: https://sub-store.vercel.app,http://substore.stash,https://substore.stash
      SUB_STORE_BACKEND_SYNC_CRON: "55 23 * * *"
